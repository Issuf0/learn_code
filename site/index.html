    <script>
      // Aplica o tema antes do React arrancar, para evitar "flash" de tema errado.
      (function () {
        try {
          var mode = localStorage.getItem('lc-theme');
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
